{% load static %}

<nav class="navbar navbar-expand-lg custom-navbar sticky-top">

    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand logo" href="{% url 'index' %}">
            SPORT<span>X</span>
        </a>

        <!-- Mobile Menu Button -->
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarContent">

            <i class="bi bi-list"></i>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">

            <!-- Center Navigation -->
            <ul class="navbar-nav mx-auto">

                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}"
   href="{% url 'index' %}">
    Home
</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'products' %}active{% endif %}"
   href="{% url 'products' %}">
    Products
</a>
                </li>

                

                <li class="nav-item">
                   <a class="nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}"
   href="{% url 'about' %}">
    About
</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}"
   href="{% url 'contact' %}">
        Contact
                    </a>
                </li>

            </ul>

            <!-- Right Side -->
            <div class="d-flex align-items-center nav-icons">

                <form
                     class="search-box me-3"
                     action="{% url 'products' %}"
                     method="GET">

                     <input
                         type="text"
                         name="search"
                         placeholder="Search Products..."
                         value="{{ request.GET.search }}">

                      <button type="submit">
                          <i class="bi bi-search"></i>
                     </button>

                </form>
                <a href="{% url 'wishlist' %}" class="icon" aria-label="Wishlist">
                    <i class="bi bi-heart"></i>
                </a>

                <a
                    href="{% url 'cart' %}"
                    class="icon position-relative"
                    aria-label="Cart">

                    <i class="bi bi-bag"></i>

                    {% if cart_count %}
                        <span class="badge-cart">{{ cart_count }}</span>
                    {% endif %}
                </a>

                {% if user.is_authenticated %}

                    <a
                        href="{% url 'profile' %}"
                        class="icon"
                        aria-label="My Profile"
                        title="My Profile">

                        <i class="bi bi-person-circle"></i>
                    </a>

                {% else %}

                    <a
                        href="{% url 'login' %}"
                        class="icon"
                        aria-label="Login"
                        title="Login">

                        <i class="bi bi-person-circle"></i>
                    </a>

                {% endif %}

            </div>

        </div>

    </div>

</nav>
